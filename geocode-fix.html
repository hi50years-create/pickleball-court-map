    fallbackLat: 36.6390, fallbackLng: 127.4650, type: "실외", access: "모름", sido: "충북", sigungu: "청주시 흥덕구",
    note: "충북 청주시 흥덕구 운천동 662-1", verified: true }
];

function geocodeOne(geocoder, address){
  return new Promise((resolve) => {
    geocoder.addressSearch(address, function(result, status){
      if(status === kakao.maps.services.Status.OK && result.length){
        resolve({ lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
      }else{
        resolve(null);
      }
    });
  });
}

async function runGeocode(){
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  btn.disabled = true;
  btn.textContent = '처리 중...';
  log.textContent = '';

  kakao.maps.load(async function(){
    const geocoder = new kakao.maps.services.Geocoder();

    const snapshot = await db.collection('courts').get();
    const existingByName = {};
    snapshot.forEach(doc => { existingByName[doc.data().name] = doc; });

    let geocoded = 0, fallback = 0, updated = 0, added = 0;

    for(const item of ITEMS){
      const coord = await geocodeOne(geocoder, item.address);
      const lat = coord ? coord.lat : item.fallbackLat;
      const lng = coord ? coord.lng : item.fallbackLng;
      if(coord){ geocoded++; } else { fallback++; }

      const payload = {
        name: item.name, type: item.type, access: item.access,
        sido: item.sido, sigungu: item.sigungu, note: item.note,
        verified: item.verified, lat, lng
      };

      const existing = existingByName[item.name];
      try{
        if(existing){
          await existing.ref.update(payload);
          updated++;
          log.textContent += `🔄 ${item.name} 보정 (${coord ? '정밀좌표' : '대략좌표 유지'})\n`;
        }else{
          await db.collection('courts').add({ ...payload, createdAt: new Date().toISOString() });
          added++;
          log.textContent += `➕ ${item.name} 신규 등록 (${coord ? '정밀좌표' : '대략좌표'})\n`;
        }
      }catch(err){
        log.textContent += `❌ ${item.name} 실패: ${err.message}\n`;
      }
    }

    btn.textContent = `완료 (정밀좌표 ${geocoded} / 대략좌표 ${fallback})`;
    log.textContent += `\n총 ${updated}건 보정, ${added}건 신규 등록. (지오코딩 성공 ${geocoded}건, 실패해서 대략좌표 쓴 곳 ${fallback}건)`;
    btn.disabled = false;
  });
}
</script>
