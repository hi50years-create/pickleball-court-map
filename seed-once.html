<body>
<h2>초기 코트 데이터 1회 등록</h2>

<button id="btn" onclick="runSeed()">초기 데이터 7건 Firestore에 등록하기</button>
<div id="log"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD2eLraL0MDoZEVEXOY_nBIitu5AHysPUQ",
  authDomain: "pickleball-court-map.firebaseapp.com",
  projectId: "pickleball-court-map",
  storageBucket: "pickleball-court-map.firebasestorage.app",
  messagingSenderId: "119777831983",
  appId: "1:119777831983:web:03317f33cc7169b65c2ada"

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const SEED_COURTS = [
  { name: "피클볼장 (고양시 피클볼협회 행주구장)", lat: 37.5941, lng: 126.8115, type: "실내", access: "예약필요", sido: "경기", sigungu: "고양시 덕양구", note: "경기도 고양시 덕양구 행주내동 733-6 · 주차장/샤워실/락커 있음 · 좌표는 근사치입니다, 정확한 위치는 네이버지도에서 확인하세요.", verified: true },
  { name: "광나루 피클볼장", lat: 37.5445, lng: 127.1211, type: "실외", access: "예약필요", sido: "서울", sigungu: "강동구", note: "서울 강동구 선사로 83-106(암사동), 광나루한강공원 안내센터 인근 · 코트 14면 · 06:00~22:00 · 평일 1시간 4,000원, 주말·공휴일 5,200원 · 서울시 공공서비스예약(선착순, 최대 3시간) · 좌표는 근사치입니다.", verified: true },
  { name: "서울숲복합문화체육센터 3층 체육관", lat: 37.5443, lng: 127.0430, type: "실내", access: "회원전용", sido: "서울", sigungu: "성동구", note: "서울 성동구 왕십리로11길 19 · 동호회 오픈플레이 매주 일요일 15:00~17:00, 무료레슨 30분 포함, 참가비 별도 · 동호회 대관 형태라 일정은 유동적일 수 있어요, 참가 전 확인 필요.", verified: true },
  { name: "코트원피클볼", lat: 37.6608, lng: 126.7473, type: "실내", access: "예약필요", sido: "경기", sigungu: "고양시 일산동구", note: "경기도 고양시 일산동구 장항로 62 A동 · 좌표는 근사치입니다, 정확한 위치는 네이버지도에서 확인하세요.", verified: true },
  { name: "엠무브 롯데 기흥점", lat: 37.2749, lng: 127.1136, type: "실내", access: "예약필요", sido: "경기", sigungu: "용인시 기흥구", note: "경기도 용인시 기흥구 신고매로 124 2층, 롯데프리미엄아울렛 기흥점 내 · 하드코트 6면 · 좌표는 근사치입니다.", verified: true },
  { name: "피클볼 클럽 520", lat: 37.5934, lng: 127.0574, type: "실내", access: "회원전용", sido: "서울", sigungu: "동대문구", note: "서울 동대문구 한천로 247 휘경여자고등학교 4층 체육관 · 오픈플레이 방식, 랜덤 매칭 · 좌표는 근사치입니다.", verified: true },
  { name: "오크밸리 피클볼장", lat: 37.4113, lng: 127.9367, type: "실외", access: "예약필요", sido: "강원", sigungu: "원주시", note: "강원 원주시 지정면 오크밸리1길 66, 오크밸리 리조트 내 · 좌표는 근사치입니다.", verified: true }
];

async function runSeed(){
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  btn.disabled = true;
  btn.textContent = '등록 중...';
  log.textContent = '';

  let ok = 0, fail = 0;
  for(const court of SEED_COURTS){
    try{
      const data = { ...court, createdAt: new Date().toISOString() };
      await db.collection('courts').add(data);
      ok++;
      log.textContent += `✅ ${court.name} 등록 완료\n`;
    }catch(err){
      fail++;
      log.textContent += `❌ ${court.name} 실패: ${err.message}\n`;
    }
  }

  btn.textContent = `완료 (성공 ${ok}건 / 실패 ${fail}건)`;
  log.textContent += `\n총 ${ok}건 등록됐어요. Firebase 콘솔 > Firestore Database > courts 에서 확인해보세요.`;
}
</script>
</body>
</html>
