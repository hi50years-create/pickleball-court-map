<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 동네 피클볼 코트</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ball: #d7f34c;      /* 피클볼 공 색 */
    --ball-dark: #a9c72a;
    --court: #14532d;     /* 실외 코트 그린 */
    --court-line: #0b3319;
    --ink: #1c2b23;
    --paper: #f6f7f1;
    --card: #ffffff;
    --pending: #ff8a3d;
    --verified: #2f7a4f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);}

  .app{display:flex;flex-direction:column;height:100vh;}

  header{
    background:var(--court);
    color:#eef7e9;
    padding:18px 20px 16px;
    border-bottom:6px solid var(--ball);
    position:relative;
    z-index:20;
  }
  header h1{
    margin:0 0 4px;
    font-size:20px;
    letter-spacing:-0.02em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  header h1 .dot{
    width:10px;height:10px;border-radius:50%;background:var(--ball);
    display:inline-block;
  }
  header p{
    margin:0;
    font-size:13px;
    color:#c9dfc4;
    line-height:1.5;
  }
  .stats{
    display:flex;
    gap:14px;
    margin-top:10px;
    font-size:12px;
  }
  .stats span{
    background:rgba(255,255,255,0.08);
    padding:4px 10px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.15);
  }
  .stats b{color:var(--ball);}

  #map{flex:1;min-height:0;}

  .hint{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:9px 16px;
    border-radius:999px;
    font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
    z-index:15;
    display:flex;
    align-items:center;
    gap:8px;
    max-width:88%;
    text-align:center;
  }
  .hint .dot{width:8px;height:8px;border-radius:50%;background:var(--ball);flex:none;}

  /* 모달 */
  .overlay{
    position:fixed;inset:0;
    background:rgba(15,25,18,0.5);
    display:none;
    align-items:center;justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card);
    width:100%;max-width:360px;
    border-radius:16px;
    padding:20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .modal h2{
    margin:0 0 4px;
    font-size:17px;
  }
  .modal .coord{
    font-size:11px;
    color:#8a9a8f;
    margin-bottom:14px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;font-size:12px;font-weight:600;
    margin-bottom:5px;color:#3a4a3e;
  }
  .field input, .field textarea, .field select{
    width:100%;
    border:1.5px solid #dfe4d9;
    border-radius:10px;
    padding:9px 11px;
    font-size:14px;
    font-family:inherit;
    resize:none;
  }
  .field input:focus, .field textarea:focus{
    outline:none;border-color:var(--court);
  }
  .row{display:flex;gap:10px;}
  .row .field{flex:1;}
  .btnrow{display:flex;gap:8px;margin-top:16px;}
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    border:none;
    border-radius:10px;
    padding:11px 14px;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--court);
    color:#fff;
    flex:1;
  }
  .btn-primary:active{background:var(--court-line);}
  .btn-ghost{
    background:#eef1ea;
    color:var(--ink);
  }
  .err{color:#c0392b;font-size:12px;margin-top:8px;display:none;}

  .leaflet-popup-content{font-size:13px;line-height:1.6;min-width:150px;}
  .leaflet-popup-content b{font-size:14px;}
  .badge{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    padding:2px 7px;
    border-radius:999px;
    margin-top:4px;
  }
  .badge.verified{background:#e3f3e6;color:var(--verified);}
  .badge.pending{background:#ffe9d6;color:var(--pending);}

  .loading{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:5;font-size:13px;color:#8a9a8f;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="dot"></span>우리 동네 피클볼 코트</h1>
    <p>지도를 눌러서 알고 있는 코트를 등록해보세요. 다른 사람이 등록한 코트도 함께 보여요.</p>
    <div class="stats">
      <span>확인된 코트 <b id="countVerified">-</b></span>
      <span>제보된 코트 <b id="countPending">-</b></span>
    </div>
  </header>

  <div style="position:relative;flex:1;min-height:0;">
    <div id="map"></div>
    <div class="hint"><span class="dot"></span>지도를 탭하면 코트를 등록할 수 있어요</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>코트 등록하기</h2>
    <div class="coord" id="coordLabel"></div>

    <div class="field">
      <label>코트 이름 / 장소명</label>
      <input id="fName" type="text" placeholder="예: OO초등학교 다목적체육관" />
    </div>
    <div class="row">
      <div class="field">
        <label>실내 / 실외</label>
        <select id="fType">
          <option value="실내">실내</option>
          <option value="실외">실외</option>
        </select>
      </div>
      <div class="field">
        <label>이용 방식</label>
        <select id="fAccess">
          <option value="무료개방">무료개방</option>
          <option value="예약필요">예약필요</option>
          <option value="회원전용">회원전용</option>
          <option value="모름">모름</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>메모 (주소, 이용 팁 등)</label>
      <textarea id="fNote" rows="3" placeholder="예: 배드민턴장 겸용, 평일 오전 한산함"></textarea>
    </div>

    <div class="err" id="formErr">코트 이름을 입력해주세요.</div>

    <div class="btnrow">
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="submitCourt()">등록하기</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------
// 시드 데이터 (예시) — 실제 배포 전, 직접 확인한 코트로 교체하세요.
// verified: true 인 항목만 "확인된 코트"로 취급합니다.
// ---------------------------------------------------------
const SEED_COURTS = [
  { name: "예시) OO체육관 배드민턴장 겸용", lat: 37.5665, lng: 126.9780, type: "실내", access: "예약필요", note: "예시 데이터입니다. 직접 확인한 코트로 교체해주세요.", verified: true },
  { name: "예시) OO공원 다목적 코트", lat: 37.5551, lng: 126.9707, type: "실외", access: "무료개방", note: "예시 데이터입니다. 직접 확인한 코트로 교체해주세요.", verified: true }
];

let map, lastClick = null;
let markersLayer;

function initMap(){
  map = L.map('map', { zoomControl: true }).setView([37.5665, 126.9780], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);

  map.on('click', function(e){
    lastClick = e.latlng;
    document.getElementById('coordLabel').textContent =
      `위치: ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
    document.getElementById('fName').value = '';
    document.getElementById('fNote').value = '';
    document.getElementById('formErr').style.display = 'none';
    document.getElementById('overlay').classList.add('show');
  });

  loadAllCourts();
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}

function makeIcon(color){
  return L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>`,
    iconSize: [16,16],
    iconAnchor: [8,8]
  });
}

function addMarker(court){
  const color = court.verified ? '#2f7a4f' : '#ff8a3d';
  const badge = court.verified
    ? '<span class="badge verified">확인됨</span>'
    : '<span class="badge pending">제보됨</span>';
  const marker = L.marker([court.lat, court.lng], { icon: makeIcon(color) });
  marker.bindPopup(
    `<b>${escapeHtml(court.name)}</b><br>` +
    `${court.type} · ${court.access}<br>` +
    `${court.note ? escapeHtml(court.note) + '<br>' : ''}` +
    badge
  );
  marker.addTo(markersLayer);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str || '';
  return d.innerHTML;
}

async function loadAllCourts(){
  markersLayer.clearLayers();

  // 시드 데이터
  SEED_COURTS.forEach(addMarker);
  let verifiedCount = SEED_COURTS.length;
  let pendingCount = 0;

  // 저장된 제보 데이터 (모든 사용자 공유)
  try{
    const list = await window.storage.list('court:', true);
    if(list && list.keys && list.keys.length){
      for(const key of list.keys){
        try{
          const res = await window.storage.get(key, true);
          if(res && res.value){
            const court = JSON.parse(res.value);
            addMarker(court);
            pendingCount++;
          }
        }catch(err){
          console.error('코트 불러오기 실패:', key, err);
        }
      }
    }
  }catch(err){
    console.error('제보 목록 불러오기 실패:', err);
  }

  document.getElementById('countVerified').textContent = verifiedCount;
  document.getElementById('countPending').textContent = pendingCount;
}

async function submitCourt(){
  const name = document.getElementById('fName').value.trim();
  const type = document.getElementById('fType').value;
  const access = document.getElementById('fAccess').value;
  const note = document.getElementById('fNote').value.trim();

  if(!name){
    document.getElementById('formErr').style.display = 'block';
    return;
  }
  if(!lastClick){
    return;
  }

  const court = {
    name, type, access, note,
    lat: lastClick.lat,
    lng: lastClick.lng,
    verified: false,
    createdAt: new Date().toISOString()
  };

  try{
    const key = 'court:' + Date.now();
    const result = await window.storage.set(key, JSON.stringify(court), true);
    if(!result){
      alert('저장에 실패했어요. 다시 시도해주세요.');
      return;
    }
    addMarker(court);
    document.getElementById('countPending').textContent =
      parseInt(document.getElementById('countPending').textContent || '0', 10) + 1;
    closeModal();
  }catch(err){
    console.error(err);
    alert('저장 중 오류가 발생했어요.');
  }
}

initMap();
</script>
</body>
</html>
