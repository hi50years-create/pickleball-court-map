<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 동네 피클볼 코트</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=9c376c904f2eee8fad8f79bc26a2502f&libraries=services&autoload=false"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ball: #d7f34c;
    --ball-dark: #a9c72a;
    --court: #14532d;
    --court-line: #0b3319;
    --ink: #1c2b23;
    --paper: #f6f7f1;
    --card: #ffffff;
    --pending: #ff8a3d;
    --verified: #2f7a4f;
    --line: #e2e6dc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);}

  .app{display:flex;flex-direction:column;height:100vh;}

  header{
    background:var(--court);
    color:#eef7e9;
    padding:16px 20px 14px;
    border-bottom:6px solid var(--ball);
    position:relative;
    z-index:20;
    flex:none;
  }
  header h1{
    margin:0 0 4px;
    font-size:20px;
    letter-spacing:-0.02em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  header h1 .dot{
    width:10px;height:10px;border-radius:50%;background:var(--ball);
    display:inline-block;
  }
  header p{
    margin:0;
    font-size:13px;
    color:#c9dfc4;
    line-height:1.5;
  }
  .stats{
    display:flex;
    gap:14px;
    margin-top:10px;
    font-size:12px;
  }
  .stats span{
    background:rgba(255,255,255,0.08);
    padding:4px 10px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.15);
  }
  .stats b{color:var(--ball);}

  .notice{
    flex:none;
    background:#fff8e8;
    color:#8a5a1f;
    font-size:12px;
    padding:8px 14px;
    border-bottom:1px solid #f0dcae;
    text-align:center;
  }

  /* 필터바 */
  .filterbar{
    flex:none;
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:10px 14px;
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    align-items:center;
    position:relative;
    z-index:19;
  }
  .filterbar select{
    font-size:12.5px;
    padding:7px 9px;
    border-radius:9px;
    border:1.5px solid var(--line);
    font-family:inherit;
    background:#fff;
    color:var(--ink);
    max-width:120px;
  }
  .filterbar .resetBtn{
    font-size:12px;
    padding:7px 11px;
    border-radius:9px;
    background:#eef1ea;
    color:var(--ink);
    font-weight:600;
    border:none;
    cursor:pointer;
  }
  .filterbar .count{
    margin-left:auto;
    font-size:12px;
    color:#5c6c60;
    white-space:nowrap;
  }
  .filterbar .count b{color:var(--court);}

  .legend{
    flex:none;
    display:flex;
    gap:16px;
    align-items:center;
    padding:7px 14px;
    background:#fff;
    border-bottom:1px solid var(--line);
    font-size:11.5px;
    color:#5c6c60;
  }
  .legendDot{
    width:10px;height:10px;border-radius:50%;
    display:inline-block;margin-right:5px;vertical-align:middle;
  }
  .legendDot.verified{background:var(--verified);}
  .legendDot.pending{background:var(--pending);}

  /* 지도 영역 */
  .mapWrap{position:relative;height:40vh;min-height:220px;flex:none;}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;}

  .hint{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:8px 14px;
    border-radius:999px;
    font-size:12.5px;
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
    z-index:15;
    display:flex;
    align-items:center;
    gap:8px;
    max-width:90%;
    text-align:center;
  }
  .hint .dot{width:8px;height:8px;border-radius:50%;background:var(--ball);flex:none;}

  /* 목록 영역 */
  .listWrap{
    flex:1;
    min-height:0;
    overflow-y:auto;
    background:var(--paper);
    padding:12px 14px 28px;
  }
  .listEmpty{
    text-align:center;color:#8a9a8f;font-size:13px;padding:30px 0;
  }
  .courtCard{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .courtCard:active{background:#f2f5ee;}
  .courtCard .ctitle{
    font-weight:700;font-size:14px;margin-bottom:4px;
    display:flex;justify-content:space-between;gap:8px;align-items:flex-start;
  }
  .courtCard .cmeta{font-size:12.5px;color:#5c6c60;}
  .courtCard .cregion{font-size:11.5px;color:#8a9a8f;margin-top:3px;}

  .pager{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin-top:10px;padding-top:6px;
  }
  .pageBtn{
    background:#fff;border:1.5px solid var(--line);color:var(--ink);
    font-size:13px;font-weight:600;padding:7px 14px;border-radius:9px;cursor:pointer;
  }
  .pageBtn:disabled{opacity:0.4;cursor:not-allowed;}
  .pageInfo{font-size:12.5px;color:#5c6c60;min-width:44px;text-align:center;}

  /* 모달 */
  .overlay{
    position:fixed;inset:0;
    background:rgba(15,25,18,0.5);
    display:none;
    align-items:center;justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card);
    width:100%;max-width:360px;
    border-radius:16px;
    padding:20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
    max-height:88vh;
    overflow-y:auto;
  }
  .modal h2{
    margin:0 0 4px;
    font-size:17px;
  }
  .modal .coord{
    font-size:11px;
    color:#8a9a8f;
    margin-bottom:14px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;font-size:12px;font-weight:600;
    margin-bottom:5px;color:#3a4a3e;
  }
  .field input, .field textarea, .field select{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:9px 11px;
    font-size:14px;
    font-family:inherit;
    resize:none;
  }
  .field input:focus, .field textarea:focus{
    outline:none;border-color:var(--court);
  }
  .row{display:flex;gap:10px;}
  .row .field{flex:1;}
  .btnrow{display:flex;gap:8px;margin-top:16px;}
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    border:none;
    border-radius:10px;
    padding:11px 14px;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--court);
    color:#fff;
    flex:1;
  }
  .btn-primary:active{background:var(--court-line);}
  .btn-ghost{
    background:#eef1ea;
    color:var(--ink);
  }
  .err{color:#c0392b;font-size:12px;margin-top:8px;display:none;}

  .leaflet-popup-content{font-size:13px;line-height:1.6;min-width:150px;}
  .leaflet-popup-content b{font-size:14px;}
  .badge{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    padding:2px 7px;
    border-radius:999px;
    white-space:nowrap;
  }
  .badge.verified{background:#e3f3e6;color:var(--verified);}
  .badge.pending{background:#ffe9d6;color:var(--pending);}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="dot"></span>우리 동네 피클볼 코트</h1>
    <p>지도를 눌러서 알고 있는 코트를 등록해보세요. 다른 사람이 등록한 코트도 함께 보여요.</p>
    <div class="stats">
      <span>확인된 코트 <b id="countVerified">-</b></span>
      <span>제보된 코트 <b id="countPending">-</b></span>
    </div>
  </header>

  <div class="notice">📍 좌표는 대략적인 위치예요. 정확한 위치는 코트명으로 직접 검색해서 확인해주세요.</div>

  <div class="filterbar">
    <select id="filterSido" onchange="onSidoChange()">
      <option value="">시/도 전체</option>
      <option value="서울">서울</option>
      <option value="부산">부산</option>
      <option value="대구">대구</option>
      <option value="인천">인천</option>
      <option value="광주">광주</option>
      <option value="대전">대전</option>
      <option value="울산">울산</option>
      <option value="세종">세종</option>
      <option value="경기">경기</option>
      <option value="강원">강원</option>
      <option value="충북">충북</option>
      <option value="충남">충남</option>
      <option value="전북">전북</option>
      <option value="전남">전남</option>
      <option value="경북">경북</option>
      <option value="경남">경남</option>
      <option value="제주">제주</option>
    </select>
    <select id="filterSigungu" onchange="applyFilters()">
      <option value="">시/군/구 전체</option>
    </select>
    <select id="filterType" onchange="applyFilters()">
      <option value="">실내/실외 전체</option>
      <option value="실내">실내</option>
      <option value="실외">실외</option>
    </select>
    <select id="filterAccess" onchange="applyFilters()">
      <option value="">이용방식 전체</option>
      <option value="무료개방">무료개방</option>
      <option value="예약필요">예약필요</option>
      <option value="회원전용">회원전용</option>
      <option value="모름">모름</option>
    </select>
    <button class="resetBtn" onclick="resetFilters()">초기화</button>
    <span class="count"><b id="filterCount">0</b>곳 표시 중</span>
  </div>

  <div class="legend">
    <span><span class="legendDot verified"></span>확인된 코트</span>
    <span><span class="legendDot pending"></span>제보된 코트</span>
  </div>

  <div class="mapWrap">
    <div id="map"></div>
    <div class="hint"><span class="dot"></span>지도를 탭하면 코트를 등록할 수 있어요</div>
  </div>

  <div class="listWrap">
    <div id="courtList"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>코트 등록하기</h2>
    <div class="coord" id="coordLabel"></div>

    <div class="field">
      <label>코트 이름 / 장소명</label>
      <input id="fName" type="text" placeholder="예: OO초등학교 다목적체육관" />
    </div>
    <div class="field">
      <label>주소 (선택 — 입력하면 정확한 위치로 자동 보정돼요)</label>
      <input id="fAddress" type="text" placeholder="예: 경기도 고양시 일산동구 장항로 62" />
    </div>
    <div class="row">
      <div class="field">
        <label>시/도</label>
        <select id="fSido">
          <option value="서울">서울</option>
          <option value="부산">부산</option>
          <option value="대구">대구</option>
          <option value="인천">인천</option>
          <option value="광주">광주</option>
          <option value="대전">대전</option>
          <option value="울산">울산</option>
          <option value="세종">세종</option>
          <option value="경기">경기</option>
          <option value="강원">강원</option>
          <option value="충북">충북</option>
          <option value="충남">충남</option>
          <option value="전북">전북</option>
          <option value="전남">전남</option>
          <option value="경북">경북</option>
          <option value="경남">경남</option>
          <option value="제주">제주</option>
        </select>
      </div>
      <div class="field">
        <label>시/군/구</label>
        <input id="fSigungu" type="text" placeholder="예: 고양시 일산동구" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>실내 / 실외</label>
        <select id="fType">
          <option value="실내">실내</option>
          <option value="실외">실외</option>
        </select>
      </div>
      <div class="field">
        <label>이용 방식</label>
        <select id="fAccess">
          <option value="무료개방">무료개방</option>
          <option value="예약필요">예약필요</option>
          <option value="회원전용">회원전용</option>
          <option value="모름">모름</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>메모 (주소, 이용 팁 등)</label>
      <textarea id="fNote" rows="3" placeholder="예: 배드민턴장 겸용, 평일 오전 한산함"></textarea>
    </div>

    <div class="err" id="formErr">코트 이름을 입력해주세요.</div>

    <div class="btnrow">
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="submitCourt()">등록하기</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------
// Firebase 설정 — 제보(크라우드소싱) 데이터 저장용
// ---------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyD2eLraL0MDoZEVEXOY_nBIitu5AHysPUQ",
  authDomain: "pickleball-court-map.firebaseapp.com",
  projectId: "pickleball-court-map",
  storageBucket: "pickleball-court-map.firebasestorage.app",
  messagingSenderId: "119777831983",
  appId: "1:119777831983:web:03317f33cc7169b65c2ada"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ---------------------------------------------------------
// 코트 데이터는 이제 전부 Firestore(courts 컬렉션)에서 불러옵니다.
// 처음 7건은 seed-once.html로 한 번만 넣어주세요 (verified:true로 등록됨).
// ---------------------------------------------------------

let map, lastClick = null;
let markersLayer;
let allCourts = [];
let courtMarkers = {};
let currentFiltered = [];
let currentPage = 1;
const PAGE_SIZE = 7;
let geocoder = null;

function initMap(){
  map = L.map('map', { zoomControl: true }).setView([37.5665, 126.9780], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);

  // 카카오는 지도 렌더링 없이 주소→좌표 변환(지오코더)만 사용
  try{
    kakao.maps.load(function(){
      geocoder = new kakao.maps.services.Geocoder();
    });
  }catch(err){
    console.warn('카카오 지오코더 로드 실패 — 주소 자동 보정 없이 진행됩니다.', err);
  }

  map.on('click', function(e){
    lastClick = e.latlng;
    document.getElementById('coordLabel').textContent =
      `위치: ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
    document.getElementById('fName').value = '';
    document.getElementById('fAddress').value = '';
    document.getElementById('fSigungu').value = '';
    document.getElementById('fNote').value = '';
    document.getElementById('formErr').style.display = 'none';
    document.getElementById('overlay').classList.add('show');
  });

  loadAllCourts();
}

function geocodeAddress(address){
  return new Promise((resolve) => {
    if(!geocoder || !address){ resolve(null); return; }
    geocoder.addressSearch(address, function(result, status){
      if(status === kakao.maps.services.Status.OK && result.length){
        resolve({ lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
      }else{
        resolve(null);
      }
    });
  });
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}

function makeIcon(color){
  return L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>`,
    iconSize: [16,16],
    iconAnchor: [8,8]
  });
}

function addMarker(court){
  const color = court.verified ? '#2f7a4f' : '#ff8a3d';
  const badge = court.verified
    ? '<span class="badge verified">확인됨</span>'
    : '<span class="badge pending">제보됨</span>';
  const marker = L.marker([court.lat, court.lng], { icon: makeIcon(color) });
  marker.bindPopup(
    `<b>${escapeHtml(court.name)}</b><br>` +
    `${court.type} · ${court.access}<br>` +
    `${escapeHtml(court.sido || '')} ${escapeHtml(court.sigungu || '')}<br>` +
    `${court.note ? escapeHtml(court.note) + '<br>' : ''}` +
    badge
  );
  marker.addTo(markersLayer);
  return marker;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str || '';
  return d.innerHTML;
}

async function loadAllCourts(){
  allCourts = [];

  try{
    const snapshot = await db.collection('courts').get();
    snapshot.forEach(doc => {
      allCourts.push({ ...doc.data(), _id: doc.id });
    });
  }catch(err){
    console.error('코트 목록 불러오기 실패:', err);
  }

  document.getElementById('countVerified').textContent = allCourts.filter(c => c.verified).length;
  document.getElementById('countPending').textContent = allCourts.filter(c => !c.verified).length;

  updateSigunguOptions();
  applyFilters();
}

function onSidoChange(){
  updateSigunguOptions();
  applyFilters();
}

function updateSigunguOptions(){
  const sido = document.getElementById('filterSido').value;
  const sel = document.getElementById('filterSigungu');
  const prev = sel.value;
  const pool = allCourts.filter(c => !sido || c.sido === sido);
  const uniq = Array.from(new Set(pool.map(c => c.sigungu).filter(Boolean))).sort();
  sel.innerHTML = '<option value="">시/군/구 전체</option>' +
    uniq.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  if(uniq.includes(prev)) sel.value = prev;
}

function resetFilters(){
  document.getElementById('filterSido').value = '';
  document.getElementById('filterType').value = '';
  document.getElementById('filterAccess').value = '';
  updateSigunguOptions();
  document.getElementById('filterSigungu').value = '';
  applyFilters();
}

function applyFilters(){
  const sido = document.getElementById('filterSido').value;
  const sigungu = document.getElementById('filterSigungu').value;
  const type = document.getElementById('filterType').value;
  const access = document.getElementById('filterAccess').value;

  const filtered = allCourts.filter(c =>
    (!sido || c.sido === sido) &&
    (!sigungu || c.sigungu === sigungu) &&
    (!type || c.type === type) &&
    (!access || c.access === access)
  ).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));

  currentPage = 1;
  renderMarkersAndList(filtered);
}

function renderMarkersAndList(filtered){
  markersLayer.clearLayers();
  courtMarkers = {};
  currentFiltered = filtered;

  document.getElementById('filterCount').textContent = filtered.length;

  // 지도에는 필터된 코트 전부 표시
  filtered.forEach(court => {
    const marker = addMarker(court);
    courtMarkers[court._id] = marker;
  });

  renderListPage();
}

function renderListPage(){
  const listEl = document.getElementById('courtList');
  listEl.innerHTML = '';

  if(currentFiltered.length === 0){
    listEl.innerHTML = '<div class="listEmpty">조건에 맞는 코트가 없어요.</div>';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(currentFiltered.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  if(currentPage < 1) currentPage = 1;

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = currentFiltered.slice(start, start + PAGE_SIZE);

  pageItems.forEach(court => {
    const card = document.createElement('div');
    card.className = 'courtCard';
    const badge = court.verified
      ? '<span class="badge verified">확인됨</span>'
      : '<span class="badge pending">제보됨</span>';
    card.innerHTML =
      `<div class="ctitle"><span>${escapeHtml(court.name)}</span>${badge}</div>` +
      `<div class="cmeta">${court.type} · ${court.access}</div>` +
      `<div class="cregion">${escapeHtml(court.sido || '')} ${escapeHtml(court.sigungu || '')}</div>`;
    card.onclick = function(){
      map.setView([court.lat, court.lng], 16);
      const m = courtMarkers[court._id];
      if(m) m.openPopup();
    };
    listEl.appendChild(card);
  });

  if(totalPages > 1){
    const pager = document.createElement('div');
    pager.className = 'pager';
    pager.innerHTML =
      `<button class="pageBtn" id="pagePrev" ${currentPage === 1 ? 'disabled' : ''}>이전</button>` +
      `<span class="pageInfo">${currentPage} / ${totalPages}</span>` +
      `<button class="pageBtn" id="pageNext" ${currentPage === totalPages ? 'disabled' : ''}>다음</button>`;
    listEl.appendChild(pager);
    document.getElementById('pagePrev').onclick = function(){ changePage(-1); };
    document.getElementById('pageNext').onclick = function(){ changePage(1); };
  }
}

function changePage(delta){
  currentPage += delta;
  renderListPage();
  document.querySelector('.listWrap').scrollTop = 0;
}

async function submitCourt(){
  const name = document.getElementById('fName').value.trim();
  const address = document.getElementById('fAddress').value.trim();
  const sido = document.getElementById('fSido').value;
  const sigungu = document.getElementById('fSigungu').value.trim();
  const type = document.getElementById('fType').value;
  const access = document.getElementById('fAccess').value;
  const note = document.getElementById('fNote').value.trim();

  if(!name){
    document.getElementById('formErr').style.display = 'block';
    return;
  }
  if(!lastClick){
    return;
  }

  const submitBtn = document.querySelector('.btn-primary');
  const originalLabel = submitBtn.textContent;
  submitBtn.disabled = true;

  let lat = lastClick.lat;
  let lng = lastClick.lng;
  let finalNote = note;

  if(address){
    submitBtn.textContent = '주소 확인 중...';
    const geo = await geocodeAddress(address);
    if(geo){
      lat = geo.lat;
      lng = geo.lng;
      finalNote = note ? `${address} · ${note}` : address;
    }else{
      // 지오코딩 실패 시 지도에서 클릭한 위치를 그대로 사용
      finalNote = note ? `${address} · ${note}` : address;
    }
  }

  const court = {
    name, sido, sigungu, type, access,
    note: finalNote,
    lat, lng,
    verified: false,
    createdAt: new Date().toISOString()
  };

  try{
    const result = await db.collection('courts').add(court);
    if(!result){
      alert('저장에 실패했어요. 다시 시도해주세요.');
      return;
    }
    allCourts.push({ ...court, _id: result.id });
    document.getElementById('countPending').textContent =
      parseInt(document.getElementById('countPending').textContent || '0', 10) + 1;
    updateSigunguOptions();
    applyFilters();
    closeModal();
  }catch(err){
    console.error(err);
    alert('저장 중 오류가 발생했어요.');
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;
  }
}

initMap();
</script>
